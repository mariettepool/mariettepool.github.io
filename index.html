<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickyPaper Weekly Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D4537E">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;color:#1a1a1a;background:#f9f8f6;min-height:100vh;}
.app{max-width:780px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
:root{
  --pink:#D4537E;--pink-bg:#FBEAF0;--pink-text:#72243E;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --orange:#D85A30;--orange-bg:#FAECE7;--orange-text:#712B13;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-text:#27500A;
  --yellow:#BA7517;--yellow-bg:#FAEEDA;--yellow-text:#633806;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-text:#085041;
  --purple:#7B4FA0;--purple-bg:#F1E9F7;--purple-text:#4A2A63;
  --gray:#5A5754;--gray-bg:#EFEDEA;--gray-text:#3A3836;
  --border:#e0ddd8;--card:#fff;--muted:#6b6967;--radius:8px;--radius-lg:12px;
}
/* ── Auth screen ── */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:2rem;}
.auth-screen h1{font-family:'Lora',serif;font-size:28px;font-weight:400;color:var(--pink);margin-bottom:.5rem;}
.auth-screen p{font-size:14px;color:var(--muted);margin-bottom:2rem;line-height:1.6;max-width:320px;}
.google-btn{display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:15px;font-weight:500;cursor:pointer;color:#3c4043;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:box-shadow .15s;}
.google-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.15);}
.google-btn svg{width:20px;height:20px;flex-shrink:0;}
.auth-loading{font-size:14px;color:var(--muted);margin-top:1.5rem;}
/* ── Top header ── */
.top-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 1rem;border-bottom:2px solid var(--pink);margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.top-header h1{font-family:'Lora',serif;font-size:26px;font-weight:400;color:var(--pink);}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.week-range{font-size:12px;color:var(--muted);}
.user-avatar{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--pink);}
.signout-btn{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;}
/* ── Calendar bar ── */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pink-bg);border:1.5px solid var(--pink);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:1rem;flex-wrap:wrap;}
.cal-bar .cal-status{font-size:12px;color:var(--pink-text);}
.cal-signin-btn{font-size:12px;padding:6px 16px;border-radius:var(--radius);background:var(--pink);color:#fff;font-weight:500;cursor:pointer;border:none;}
.cal-signout-btn{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;}
/* ── Upcoming banner ── */
.upcoming-banner{background:var(--pink-bg);border:1.5px solid var(--pink);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:1rem;cursor:pointer;}
.banner-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--pink-text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.banner-title .exp{font-size:10px;text-transform:none;letter-spacing:0;color:var(--pink);}
.banner-item{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;}
.banner-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.banner-when{font-size:11px;color:var(--muted);min-width:56px;flex-shrink:0;}
/* ── Nav tabs ── */
.nav-tabs{display:flex;gap:4px;margin-bottom:1.25rem;flex-wrap:wrap;}
.ntab{padding:5px 13px;border-radius:20px;border:1.5px solid;font-size:12px;cursor:pointer;background:transparent;font-weight:500;transition:all .15s;}
.ntab-day{border-color:var(--pink);color:var(--pink);}
.ntab-day.active,.ntab-day:hover{background:var(--pink);color:#fff;}
.ntab-month{border-color:var(--purple);color:var(--purple);}
.ntab-month.active,.ntab-month:hover{background:var(--purple);color:#fff;}
.ntab-dinner{border-color:var(--orange);color:var(--orange);}
.ntab-dinner.active,.ntab-dinner:hover{background:var(--orange);color:#fff;}
.ntab-habits{border-color:var(--green);color:var(--green);}
.ntab-habits.active,.ntab-habits:hover{background:var(--green);color:#fff;}
.ntab-cleaning{border-color:var(--teal);color:var(--teal);}
.ntab-cleaning.active,.ntab-cleaning:hover{background:var(--teal);color:#fff;}
.ntab-todo{border-color:var(--blue);color:var(--blue);}
.ntab-todo.active,.ntab-todo:hover{background:var(--blue);color:#fff;}
.ntab-notes{border-color:#993556;color:#993556;}
.ntab-notes.active,.ntab-notes:hover{background:#993556;color:#fff;}
/* ── Day nav ── */
.day-nav{display:flex;gap:6px;margin-bottom:1.25rem;overflow-x:auto;padding-bottom:4px;}
.day-btn{flex-shrink:0;padding:8px 12px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:transparent;text-align:center;transition:all .15s;min-width:60px;}
.day-btn .dname{font-weight:500;display:block;font-size:11px;}
.day-btn .ddate{font-size:10px;color:var(--muted);}
.day-btn:hover{border-color:var(--pink);color:var(--pink);}
.day-btn.active{background:var(--pink);border-color:var(--pink);color:#fff;}
.day-btn.active .ddate{color:rgba(255,255,255,.75);}
/* ── Sections & cards ── */
.section{margin-bottom:1.25rem;}
.st{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;padding:2px 8px;border-radius:10px;display:inline-block;}
.st-pink{background:var(--pink-bg);color:var(--pink-text);}
.st-blue{background:var(--blue-bg);color:var(--blue-text);}
.st-orange{background:var(--orange-bg);color:var(--orange-text);}
.st-green{background:var(--green-bg);color:var(--green-text);}
.st-teal{background:var(--teal-bg);color:var(--teal-text);}
.st-purple{background:var(--purple-bg);color:var(--purple-text);}
.card-block{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-pink{border-color:var(--pink)!important;border-width:1.5px!important;}
.card-blue{border-color:var(--blue)!important;border-width:1.5px!important;}
.card-orange{border-color:var(--orange)!important;border-width:1.5px!important;}
.card-green{border-color:var(--green)!important;border-width:1.5px!important;}
.card-teal{border-color:var(--teal)!important;border-width:1.5px!important;}
.card-purple{border-color:var(--purple)!important;border-width:1.5px!important;}
/* ── Event rows ── */
.event-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);}
.event-row:last-child{border-bottom:none;}
.event-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;}
.event-name{flex:1;font-size:13px;}
.event-person{font-size:10px;font-weight:500;padding:1px 6px;border-radius:8px;margin-right:4px;}
.event-time{font-size:11px;color:var(--blue);font-weight:500;}
/* ── Checkable rows ── */
.check-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.row-label{font-size:13px;flex:1;}
.prog-bar{height:4px;border-radius:2px;margin:6px 0 10px;}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;}
.prog-label{font-size:11px;color:var(--muted);}
/* ── Dinner ── */
.dp-day{font-size:12px;font-weight:500;min-width:36px;color:var(--orange);}
.dp-day.today{background:var(--orange);color:#fff;padding:2px 6px;border-radius:6px;text-align:center;}
.dp-input{flex:1;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1a1a;outline:none;}
.dp-input::placeholder{color:var(--muted);opacity:.6;}
.dp-saved{font-size:10px;color:var(--green);opacity:0;transition:opacity .3s;font-weight:500;}
.dp-saved.show{opacity:1;}
.dinner-plan-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);position:relative;}
.dinner-plan-row:last-child{border-bottom:none;}
.meal-suggestions{position:absolute;top:100%;left:42px;right:30px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 10px rgba(0,0,0,.08);z-index:5;max-height:160px;overflow-y:auto;}
.meal-suggestion{padding:7px 12px;font-size:12px;cursor:pointer;}
.meal-suggestion:hover{background:var(--orange-bg);}
/* ── Add rows ── */
.add-row{display:flex;gap:8px;margin-bottom:10px;}
.add-input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.add-input:focus{border-color:var(--pink);}
.add-btn{padding:9px 16px;border-radius:var(--radius);border:none;font-size:13px;font-weight:500;cursor:pointer;color:#fff;flex-shrink:0;}
.add-btn:hover{opacity:.9;}
.del-btn{width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.del-btn:hover{background:#f0eeec;color:#c0392b;}
.row-flex{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);}
.row-flex:last-child{border-bottom:none;}
.focus-input{width:100%;padding:10px 14px;border:1.5px solid var(--pink);border-radius:var(--radius);background:var(--pink-bg);font-family:'DM Sans',sans-serif;font-size:13px;font-style:italic;color:var(--pink-text);outline:none;}
.focus-input::placeholder{opacity:.6;font-style:italic;}
.empty-add-msg{padding:1rem 14px;text-align:center;font-size:12px;color:var(--muted);}
.empty-msg{padding:1.5rem;text-align:center;font-size:13px;color:var(--muted);}
/* ── Month view ── */
.month-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.month-hdr h2{font-family:'Lora',serif;font-size:18px;font-weight:400;color:var(--purple-text);}
.month-nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--purple);background:transparent;color:var(--purple);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.month-nav-btn:hover{background:var(--purple-bg);}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.month-dow{font-size:10px;color:var(--muted);text-align:center;font-weight:500;padding-bottom:4px;}
.month-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;min-height:80px;padding:4px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.month-cell:hover{border-color:var(--purple);}
.month-cell.other-month{opacity:.35;}
.month-cell.today{border-color:var(--pink);border-width:2px;}
.month-cell .mc-date{font-weight:500;color:var(--gray-text);}
.month-cell .mc-evt-list{display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.month-cell .mc-evt{font-size:9px;line-height:1.3;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.month-cell .mc-more{font-size:9px;color:var(--muted);padding:0 4px;}
.month-day-panel{margin-top:1rem;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:.75rem;font-size:11px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:4px;}
.legend .ldot{width:8px;height:8px;border-radius:50%;}
/* ── Notes ── */
.notes-area{width:100%;min-height:160px;font-family:'DM Sans',sans-serif;font-size:13px;padding:12px 14px;border:1.5px solid var(--pink);border-radius:var(--radius);background:var(--pink-bg);color:#1a1a1a;resize:vertical;line-height:1.6;}
.notes-area:focus{outline:none;border-color:var(--pink-text);}
.notes-saved{font-size:11px;color:var(--green);margin-top:6px;height:14px;font-weight:500;}
/* ── Sync indicator ── */
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;}
.sync-dot.syncing{background:var(--yellow);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-screen" style="display:none">
  <h1>StickyPaper Weekly Planner</h1>
  <p>Your personal family planner. Sign in with Google to get started — your data syncs across all your devices.</p>
  <button class="google-btn" id="google-signin-btn">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign in with Google
  </button>
  <p class="auth-loading" id="auth-loading" style="display:none">Loading…</p>
</div>

<!-- MAIN APP -->
<div class="app" id="main-app" style="display:none">
  <div class="top-header">
    <h1>StickyPaper Weekly Planner</h1>
    <div class="header-right">
      <span class="week-range" id="week-range"></span>
      <span id="sync-status" style="font-size:11px;color:var(--muted)"></span>
      <img class="user-avatar" id="user-avatar" src="" alt="" style="display:none">
      <button class="signout-btn" id="signout-btn">Sign out</button>
    </div>
  </div>

  <div class="cal-bar" id="cal-bar">
    <span class="cal-status" id="cal-status">Connecting to Google Calendar…</span>
    <button class="cal-signin-btn" id="cal-signin-btn" style="display:none">Connect Calendar</button>
    <button class="cal-signout-btn" id="cal-signout-btn" style="display:none">Disconnect</button>
  </div>

  <div class="upcoming-banner" id="upcoming-banner" onclick="setView('month')">
    <div class="banner-title"><span>Coming up in the next 7 days</span><span class="exp">View full month →</span></div>
    <div id="banner-items"></div>
  </div>

  <div class="nav-tabs">
    <button class="ntab ntab-day active"   onclick="setView('day')">Day view</button>
    <button class="ntab ntab-month"        onclick="setView('month')">Month view</button>
    <button class="ntab ntab-dinner"       onclick="setView('dinner')">Dinner</button>
    <button class="ntab ntab-habits"       onclick="setView('habits')">Habits</button>
    <button class="ntab ntab-cleaning"     onclick="setView('cleaning')">Cleaning</button>
    <button class="ntab ntab-todo"         onclick="setView('todo')">To-do</button>
    <button class="ntab ntab-notes"        onclick="setView('notes')">Notes</button>
  </div>

  <div id="view-day"><div class="day-nav" id="day-nav"></div><div id="day-content"></div></div>
  <div id="view-month"    style="display:none"></div>
  <div id="view-dinner"   style="display:none"></div>
  <div id="view-habits"   style="display:none"></div>
  <div id="view-cleaning" style="display:none"></div>
  <div id="view-todo"     style="display:none"></div>
  <div id="view-notes"    style="display:none"></div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, signOut, GoogleAuthProvider, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── PASTE YOUR firebaseConfig HERE ──
const firebaseConfig = {
  apiKey: "AIzaSyAfo1GRLp5keYakJlE9EsC5s4CvkiClTcw",
  authDomain: "sticky-planner.firebaseapp.com",
  projectId: "sticky-planner",
  storageBucket: "sticky-planner.firebasestorage.app",
  messagingSenderId: "1036703981049",
  appId: "1:1036703981049:web:09e93dcfa2804f717bb128"
};

// ── PASTE YOUR GOOGLE OAUTH CLIENT ID HERE ──
// Found in Firebase Console → Authentication → Sign-in method → Google → Web client ID
const GOOGLE_OAUTH_CLIENT_ID = "1036703981049-et7d7ubvo6s5bkndnccded0l4pbgqdag.apps.googleusercontent.com";

// ── PERSON TAG COLOURS — users edit events in Google Calendar as [Name] Event ──
const PERSON_COLORS = {
  'Emma':    {dot:'var(--blue)',   bg:'var(--blue-bg)',   text:'var(--blue-text)'},
  'Liam':    {dot:'var(--green)',  bg:'var(--green-bg)',  text:'var(--green-text)'},
  'Mom':     {dot:'var(--pink)',   bg:'var(--pink-bg)',   text:'var(--pink-text)'},
  'Dad':     {dot:'var(--teal)',   bg:'var(--teal-bg)',   text:'var(--teal-text)'},
  '_default':{dot:'var(--gray)',   bg:'var(--gray-bg)',   text:'var(--gray-text)'}
};

// ════════════════════════════════════════
//  FIREBASE INIT
// ════════════════════════════════════════
const app       = initializeApp(firebaseConfig);
const auth      = getAuth(app);
const db        = getFirestore(app);
const provider  = new GoogleAuthProvider();
provider.addScope('https://www.googleapis.com/auth/calendar.readonly');

let currentUser = null;
let calToken    = null;
let calEvents   = [];
let unsubData   = null;
let saveTimer   = null;

// ── DEFAULT DATA SHAPE ──
const EMPTY_DATA = () => ({
  focusByDate:{}, dinnerByDate:{}, mealHistory:[],
  tasksByDate:{}, todos:[],
  habits:[], habitDone:{},
  cleaning:[], cleaningDone:{},
  notes:''
});
let DATA = EMPTY_DATA();

// ── DATE HELPERS ──
const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const SHORT     = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dkey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return x;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

let activeDay=0, currentView='day';
let weekCursor=startOfWeek(new Date());
let monthCursor=new Date();
let selectedMonthDate=null;

// ════════════════════════════════════════
//  FIRESTORE SAVE / LOAD
// ════════════════════════════════════════
function setSyncStatus(msg){
  const el=document.getElementById('sync-status');
  if(el)el.textContent=msg;
}

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async ()=>{
    if(!currentUser)return;
    setSyncStatus('⟳ Saving…');
    try{
      await setDoc(doc(db,'users',currentUser.uid,'planner','data'), DATA);
      setSyncStatus('✓ Saved');
      setTimeout(()=>setSyncStatus(''),2000);
    }catch(e){
      setSyncStatus('⚠ Save failed');
      console.error('Firestore save error',e);
    }
  }, 800);
}

function subscribeData(){
  if(unsubData)unsubData();
  unsubData=onSnapshot(doc(db,'users',currentUser.uid,'planner','data'), snap=>{
    if(snap.exists()){
      DATA=Object.assign(EMPTY_DATA(), snap.data());
    }else{
      DATA=EMPTY_DATA();
    }
    renderAll();
  }, err=>{
    console.error('Firestore listen error',err);
  });
}

// ════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════
onAuthStateChanged(auth, user=>{
  document.getElementById('auth-loading').style.display='none';
  if(user){
    currentUser=user;
    showApp(user);
    subscribeData();
    tryAutoCalendar(user);
  }else{
    currentUser=null;
    if(unsubData){unsubData();unsubData=null;}
    showAuth();
  }
});

document.getElementById('google-signin-btn').addEventListener('click', async ()=>{
  document.getElementById('auth-loading').style.display='block';
  try{
    const result = await signInWithPopup(auth, provider);
    // Grab calendar token from credential
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if(cred && cred.accessToken){
      calToken=cred.accessToken;
      localStorage.setItem('cal_token_'+(currentUser?currentUser.uid:''), calToken);
    }
  }catch(e){
    document.getElementById('auth-loading').style.display='none';
    document.getElementById('auth-loading').textContent='Sign-in failed: '+e.message;
    document.getElementById('auth-loading').style.display='block';
    document.getElementById('auth-loading').style.color='#c0392b';
  }
});

// ════════════════════════════════════════
//  GOOGLE CALENDAR (uses token from sign-in)
// ════════════════════════════════════════
let tokenClient=null;

function initTokenClient(){
  if(typeof google==='undefined'||!google.accounts)return;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_OAUTH_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/calendar.readonly',
    callback:(resp)=>{
      if(resp.error){
        refreshCalendarUI(false);
        return;
      }
      calToken=resp.access_token;
      if(currentUser)localStorage.setItem('cal_token_'+currentUser.uid, calToken);
      fetchCalendarEvents();
    }
  });
}

function tryAutoCalendar(user){
  // Wait for GIS to load then init token client
  const tryInit=()=>{
    if(typeof google!=='undefined'&&google.accounts){
      initTokenClient();
      const stored=localStorage.getItem('cal_token_'+user.uid);
      if(stored){
        calToken=stored;
        fetchCalendarEvents();
      } else {
        calToken=null;
        refreshCalendarUI(false);
      }
    } else {
      setTimeout(tryInit, 300);
    }
  };
  tryInit();
}

function refreshCalendarUI(loaded){
  const statusEl=document.getElementById('cal-status');
  const signinBtn=document.getElementById('cal-signin-btn');
  const signoutBtn=document.getElementById('cal-signout-btn');
  if(calToken && loaded){
    statusEl.textContent='✓ Google Calendar connected — '+calEvents.length+' events loaded';
    signinBtn.style.display='none';
    signoutBtn.style.display='inline';
  }else if(calToken && !loaded){
    statusEl.textContent='Loading calendar…';
    signinBtn.style.display='none';
    signoutBtn.style.display='inline';
  }else{
    statusEl.textContent='Connect your Google Calendar to see events';
    signinBtn.style.display='inline';
    signoutBtn.style.display='none';
  }
}

document.getElementById('cal-signin-btn').addEventListener('click', ()=>{
  if(tokenClient){
    tokenClient.requestAccessToken({prompt:'consent'});
  } else {
    // Fallback: try Firebase popup
    const calProvider = new GoogleAuthProvider();
    calProvider.addScope('https://www.googleapis.com/auth/calendar.readonly');
    signInWithPopup(auth, calProvider).then(result=>{
      const cred = GoogleAuthProvider.credentialFromResult(result);
      if(cred && cred.accessToken){
        calToken=cred.accessToken;
        if(currentUser)localStorage.setItem('cal_token_'+currentUser.uid, calToken);
        fetchCalendarEvents();
      }
    }).catch(e=>{
      document.getElementById('cal-status').textContent='Could not connect: '+e.message;
    });
  }
});

document.getElementById('cal-signout-btn').addEventListener('click', ()=>{
  calToken=null;calEvents=[];
  if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
  refreshCalendarUI(false);renderBanner();renderDayContent();
  if(currentView==='month')renderMonth();
});

async function fetchCalendarEvents(){
  if(!calToken)return;
  document.getElementById('cal-status').textContent='Loading calendar…';
  try{
    const timeMin=new Date();timeMin.setMonth(timeMin.getMonth()-1);
    const timeMax=new Date();timeMax.setMonth(timeMax.getMonth()+6);
    const params=new URLSearchParams({
      timeMin:timeMin.toISOString(),
      timeMax:timeMax.toISOString(),
      singleEvents:'true',
      orderBy:'startTime',
      maxResults:'2500'
    });
    const res=await fetch(
      'https://www.googleapis.com/calendar/v3/calendars/primary/events?'+params,
      {headers:{Authorization:'Bearer '+calToken}}
    );
    if(res.status===401){
      calToken=null;if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
      refreshCalendarUI(false);
      renderBanner();
      return;
    }
    if(!res.ok){
      calToken=null;if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
      refreshCalendarUI(false);
      renderBanner();
      return;
    }
    const data=await res.json();
    calEvents=(data.items||[]).map(ev=>{
      const allDay=!!(ev.start&&ev.start.date);
      const start=allDay?new Date(ev.start.date+'T00:00:00'):new Date(ev.start.dateTime);
      const end=allDay?new Date(ev.end.date+'T00:00:00'):new Date(ev.end.dateTime);
      const {person,name}=parsePersonTag(ev.summary||'(untitled)');
      return{start,end,allDay,person,name};
    });
    console.log('Calendar loaded: '+calEvents.length+' events');
    refreshCalendarUI(true);
    renderBanner();
    renderDayContent();
    if(currentView==='month')renderMonth();
  }catch(err){
    calToken=null;if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
    refreshCalendarUI(false);
    renderBanner();
  }
}

function parsePersonTag(title){
  const m=(title||'').match(/^\s*\[([^\]]+)\]\s*(.*)$/);
  if(m)return{person:m[1].trim(),name:m[2].trim()||m[1].trim()};
  return{person:null,name:title||''};
}
function personStyle(person){return PERSON_COLORS[person]||PERSON_COLORS['_default'];}
function eventsOnDate(dateObj){
  const y=dateObj.getFullYear(),m=dateObj.getMonth(),da=dateObj.getDate();
  return calEvents.filter(ev=>{
    const s=new Date(ev.start.getFullYear(),ev.start.getMonth(),ev.start.getDate());
    const eEnd=new Date(ev.end.getFullYear(),ev.end.getMonth(),ev.end.getDate());
    const d=new Date(y,m,da);
    if(ev.allDay)return d>=s&&d<eEnd;
    return d.getTime()===s.getTime();
  }).sort((a,b)=>a.start-b.start);
}
function fmtTime(d,allDay){
  if(allDay)return'All day';
  return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}

function renderBanner(){
  const el=document.getElementById('banner-items');
  if(!calToken){
    el.innerHTML='<span style="font-size:12px;color:var(--pink-text)">Click <b>Connect Calendar</b> in the bar above to see your upcoming events.</span>';
    return;
  }
  if(calEvents.length===0){
    el.innerHTML='<span style="font-size:12px;color:var(--pink-text);">Loading calendar events…</span>';
    return;
  }
  const today=new Date();today.setHours(0,0,0,0);
  const items=[];
  for(let i=0;i<=7;i++){
    const d=new Date(today);d.setDate(d.getDate()+i);
    eventsOnDate(d).forEach(ev=>{
      const dayLabel=(()=>{
        if(i===0)return'Today';
        if(i===1)return'Tomorrow';
        const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return dn[d.getDay()]+' '+d.getDate();
      })();
      items.push({diff:i,day:dayLabel,ev});
    });
  }
  el.innerHTML=items.length
    ?items.map(it=>{
        const ps=personStyle(it.ev.person);
        const tag=it.ev.person?`<span class="event-person" style="background:${ps.bg};color:${ps.text}">${esc(it.ev.person)}</span>`:'';
        return`<div class="banner-item"><div class="banner-dot" style="background:${ps.dot}"></div><span class="banner-when">${it.day}</span>${tag}<span>${esc(it.ev.name)}</span></div>`;
      }).join('')
    :'<span style="font-size:12px;color:var(--pink-text);">No upcoming events in the next 7 days.</span>';
}

function showMealSuggestions(query,box,inputEl,k){
  const q=(query||'').trim().toLowerCase();
  let matches=DATA.mealHistory.filter(m=>m.toLowerCase()!==q);
  if(q)matches=matches.filter(m=>m.toLowerCase().includes(q));
  matches=matches.slice(0,6);
  if(!matches.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="meal-suggestions">${matches.map(m=>`<div class="meal-suggestion" data-val="${esc(m)}">${esc(m)}</div>`).join('')}</div>`;
  box.querySelectorAll('.meal-suggestion').forEach(el=>{el.addEventListener('mousedown',function(ev){ev.preventDefault();const v=this.dataset.val;inputEl.value=v;DATA.dinnerByDate[k]=v;save();box.innerHTML='';});});
}
function rememberMeal(val){
  const v=(val||'').trim();if(!v)return;
  DATA.mealHistory=DATA.mealHistory.filter(m=>m.toLowerCase()!==v.toLowerCase());
  DATA.mealHistory.unshift(v);
  if(DATA.mealHistory.length>40)DATA.mealHistory=DATA.mealHistory.slice(0,40);
  save();
}
function toggleHabitForDate(habitId,k){
  if(!DATA.habitDone[k])DATA.habitDone[k]={};
  DATA.habitDone[k][habitId]=!DATA.habitDone[k][habitId];
  save();renderDayContent();
  if(currentView==='habits')renderHabits();
}
function toggleCleaningForDate(cleanId,k){
  if(!DATA.cleaningDone[k])DATA.cleaningDone[k]={};
  DATA.cleaningDone[k][cleanId]=!DATA.cleaningDone[k][cleanId];
  save();renderCleaning();
}

  document.getElementById('month-next').addEventListener('click',()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderMonth();});
  el.querySelectorAll('.month-cell').forEach(cell=>{cell.addEventListener('click',()=>{selectedMonthDate=new Date(cell.dataset.iso);renderMonthDayPanel();});});
  if(!selectedMonthDate)selectedMonthDate=today;
  renderMonthDayPanel();
}

  const evts=eventsOnDate(selectedMonthDate);

  let h=`<div class="st st-purple">${esc(label)}</div><div class="card-block card-purple">`;
  if(!evts.length){h+='<div class="empty-msg">No events this day.</div>';}

function renderDinner(){

  DAY_NAMES.forEach((day,i)=>{
    const dt=dayDate(i),k=dkey(dt);
    const val=DATA.dinnerByDate[k]||'';
    const t=i===activeDay;
    h+=`<div class="dinner-plan-row"><span class="dp-day${t?' today':''}">${SHORT[i]}</span><input class="dp-input" id="dpw-${i}" type="text" autocomplete="off" placeholder="What's for dinner?" value="${esc(val)}"><span class="dp-saved" id="dpws-${i}">✓</span><div id="dpw-sug-${i}"></div></div>`;
  });
  h+=`</div></div><p style="font-size:11px;color:var(--muted)">Start typing to see meals you've used before.</p>`;
  document.getElementById('view-dinner').innerHTML=h;
  DAY_NAMES.forEach((day,i)=>{
    const dt=dayDate(i),k=dkey(dt);
    const inputEl=document.getElementById('dpw-'+i);
    const sugBox=document.getElementById('dpw-sug-'+i);
    const savedEl=document.getElementById('dpws-'+i);
    inputEl.addEventListener('input',function(){DATA.dinnerByDate[k]=this.value;save();savedEl.classList.add('show');setTimeout(()=>savedEl.classList.remove('show'),1200);showMealSuggestions(this.value,sugBox,inputEl,k);});
    inputEl.addEventListener('focus',function(){showMealSuggestions(this.value,sugBox,inputEl,k);});
    inputEl.addEventListener('blur',function(){rememberMeal(this.value);setTimeout(()=>{sugBox.innerHTML='';},150);});
  });
}

// ── HABITS ──
function renderHabits(){
  const el=document.getElementById('view-habits');el.innerHTML='';
  const weekDates=DAY_NAMES.map((_,i)=>dkey(dayDate(i)));
  let totalTicked=0;
  DATA.habits.forEach(hbt=>{weekDates.forEach(k=>{if(DATA.habitDone[k]&&DATA.habitDone[k][hbt.id])totalTicked++;});});
  const totalPossible=DATA.habits.length*7;
  const pct=totalPossible?Math.round(totalTicked/totalPossible*100):0;
  const section=document.createElement('div');section.className='section';
  const prog=document.createElement('div');prog.className='prog-label';prog.textContent=totalTicked+' of '+totalPossible+' done this week';
  const bar=document.createElement('div');bar.className='prog-bar';bar.style.background='var(--green-bg)';
  const fill=document.createElement('div');fill.className='prog-fill';fill.style.cssText='width:'+pct+'%;background:var(--green)';
  bar.appendChild(fill);
  const addRow=document.createElement('div');addRow.className='add-row';
  const addInput=document.createElement('input');addInput.className='add-input';addInput.type='text';addInput.placeholder='Add a habit…';
  const addBtn=document.createElement('button');addBtn.className='add-btn';addBtn.textContent='Add';addBtn.style.background='var(--green)';
  addRow.appendChild(addInput);addRow.appendChild(addBtn);
  function doAdd(){const v=addInput.value.trim();if(!v)return;DATA.habits.push({id:uid(),name:v});save();renderHabits();}
  addBtn.addEventListener('click',doAdd);addInput.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
  const hdrRow=document.createElement('div');hdrRow.style.cssText='display:flex;align-items:center;padding:6px 14px 4px;gap:4px';
  const hdrSpacer=document.createElement('div');hdrSpacer.style.cssText='flex:1;min-width:0';hdrRow.appendChild(hdrSpacer);
  SHORT.forEach(s=>{const d=document.createElement('div');d.style.cssText='width:22px;text-align:center;font-size:10px;font-weight:500;color:var(--muted);flex-shrink:0';d.textContent=s[0];hdrRow.appendChild(d);});
  const delSpacer=document.createElement('div');delSpacer.style.cssText='width:24px;flex-shrink:0';hdrRow.appendChild(delSpacer);
  const card=document.createElement('div');card.className='card-block card-green';
  DATA.habits.forEach(hbt=>{
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;padding:8px 14px;border-bottom:.5px solid var(--border);gap:4px';
    const lbl=document.createElement('span');lbl.style.cssText='flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';lbl.title=hbt.name;lbl.textContent=hbt.name;row.appendChild(lbl);
    weekDates.forEach(k=>{
      const ticked=!!(DATA.habitDone[k]&&DATA.habitDone[k][hbt.id]);
      const btn=document.createElement('button');btn.type='button';
      btn.style.cssText='width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;background:'+(ticked?'var(--green)':'transparent')+';border:2px solid var(--green)';
      if(ticked){const ck=document.createElement('div');ck.style.cssText='width:6px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)';btn.appendChild(ck);}
      btn.addEventListener('click',function(){toggleHabitForDate(hbt.id,k);});
      row.appendChild(btn);
    });
    const delBtn=document.createElement('button');delBtn.className='del-btn';delBtn.textContent='✕';delBtn.style.flexShrink='0';
    delBtn.addEventListener('click',function(){DATA.habits=DATA.habits.filter(h2=>h2.id!==hbt.id);save();renderHabits();});
    row.appendChild(delBtn);card.appendChild(row);
  });
  section.appendChild(prog);section.appendChild(bar);section.appendChild(addRow);section.appendChild(hdrRow);section.appendChild(card);
  el.appendChild(section);
}

// ── TO-DO ──
function renderTodo(){
  const done=DATA.todos.filter(t=>t.done).length;
  const total=DATA.todos.length;
  let h=`<div class="section">`;
  h+=`<div class="add-row"><input class="add-input" id="todo-add-input" type="text" placeholder="Add something to your to-do list…"><button class="add-btn" id="todo-add-btn" style="background:var(--blue)">Add</button></div>`;
  if(total){const pct=Math.round(done/total*100);h+='<div class="prog-label">'+done+' of '+total+' complete ('+pct+'%)</div><div class="prog-bar" style="background:var(--blue-bg)"><div class="prog-fill" style="width:'+pct+'%;background:var(--blue)"></div></div>';}
  h+=`<div id="todo-list" class="card-block card-blue" style="margin-top:8px">`;
  if(!total){h+='<div class="empty-add-msg">Nothing on your to-do list yet.</div>';}
  else{DATA.todos.forEach(t=>{h+=`<div class="row-flex"><div class="task-btn" data-id="${t.id}" style="display:flex;align-items:center;gap:10px;flex:1;cursor:pointer"><div style="width:17px;height:17px;border-radius:50%;border:2px solid ${t.done?'var(--blue)':'#ccc'};background:${t.done?'var(--blue)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center">${t.done?'<div style="width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);pointer-events:none"></div>':''}</div><span style="font-size:13px;flex:1;${t.done?'text-decoration:line-through;opacity:.45':''};pointer-events:none">${esc(t.name)}</span></div><button class="del-btn todo-del" data-id="${t.id}">✕</button></div>`;});}
  h+=`</div></div>`;
  document.getElementById('view-todo').innerHTML=h;
  const addInput=document.getElementById('todo-add-input');
  const addBtn=document.getElementById('todo-add-btn');
  function doAdd(){const v=addInput.value.trim();if(!v)return;DATA.todos.push({id:uid(),name:v,done:false});save();renderTodo();}
  addBtn.addEventListener('click',doAdd);addInput.addEventListener('keydown',e=>{if(e.key==='Enter')doAdd();});
  document.getElementById('todo-list').addEventListener('click',function(e){
    const delBtn=e.target.closest('.todo-del');
    if(delBtn){DATA.todos=DATA.todos.filter(t=>t.id!==delBtn.dataset.id);save();renderTodo();return;}
    const btn=e.target.closest('.task-btn');
    if(!btn)return;toggleTodo(btn.dataset.id);
  });
}

// ── NOTES ──
function renderNotes(){
  document.getElementById('view-notes').innerHTML=`<div class="section"><div class="st st-pink">Weekly notes</div>
    <textarea class="notes-area" id="notes-ta" placeholder="Jot down anything for this week...">${esc(DATA.notes||'')}</textarea>
    <div class="notes-saved" id="notes-saved"></div>
  </div>`;
  document.getElementById('notes-ta').addEventListener('input',function(){
    DATA.notes=this.value;save();
    const s=document.getElementById('notes-saved');s.textContent='✓ Saved';setTimeout(()=>{s.textContent='';},2000);
  });
}
