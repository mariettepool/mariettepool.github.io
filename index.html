<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StickyPaper Weekly Planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF5A5F">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;color:#2F2F2F;background:#FFFDF8;min-height:100vh;-webkit-font-smoothing:antialiased;}
.app{max-width:780px;margin:0 auto;padding:1.5rem 1.25rem 3rem;}
:root{
  /* StickyPaper Brand Colours */
  --coral:#FF5A5F;--coral-bg:#FFF0F0;--coral-text:#8B1A1D;
  --mustard:#F4B400;--mustard-bg:#FFF8E1;--mustard-text:#7A5800;
  --charcoal:#2F2F2F;--charcoal-bg:#F2F2F2;--charcoal-text:#1a1a1a;
  --warm-white:#FFFDF8;

  /* Map brand to app colour roles */
  --pink:#FF5A5F;--pink-bg:#FFF0F0;--pink-text:#8B1A1D;
  --blue:#2F2F2F;--blue-bg:#F2F2F2;--blue-text:#1a1a1a;
  --orange:#F4B400;--orange-bg:#FFF8E1;--orange-text:#7A5800;
  --green:#2F8C4E;--green-bg:#E8F5ED;--green-text:#1A5C33;
  --yellow:#F4B400;--yellow-bg:#FFF8E1;--yellow-text:#7A5800;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-text:#085041;
  --purple:#FF5A5F;--purple-bg:#FFF0F0;--purple-text:#8B1A1D;
  --gray:#888580;--gray-bg:#F5F4F2;--gray-text:#3A3836;
  --border:#E8E5DF;--card:#FFFDF8;--muted:#888580;--radius:8px;--radius-lg:12px;
}
/* ── Auth screen ── */
.auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;background-image:radial-gradient(circle,#2F2F2F 1px,transparent 1px);background-size:24px 24px;background-color:#FFFDF8;}
.auth-screen h1{font-family:'Lora',serif;font-size:32px;font-weight:400;color:var(--coral);margin-bottom:.25rem;line-height:1.2;}
.auth-screen p{font-size:14px;color:var(--muted);margin-bottom:2rem;line-height:1.6;max-width:320px;}
.google-btn{display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:15px;font-weight:500;cursor:pointer;color:#3c4043;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:box-shadow .15s;}
.google-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.15);}
.google-btn svg{width:20px;height:20px;flex-shrink:0;}
.auth-loading{font-size:14px;color:var(--muted);margin-top:1.5rem;}
/* ── Top header ── */
.top-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 1rem;border-bottom:2px solid var(--coral);margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
.top-header h1{font-family:'Lora',serif;font-size:20px;font-weight:400;color:var(--coral);}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.week-range{font-size:12px;color:var(--muted);}
.user-avatar{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--coral);}
.signout-btn{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;}
/* ── Calendar bar ── */
.cal-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--coral-bg);border:1.5px solid var(--coral);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:1rem;flex-wrap:wrap;}
.cal-bar .cal-status{font-size:12px;color:var(--coral-text);}
.cal-signin-btn{font-size:12px;padding:6px 16px;border-radius:var(--radius);background:var(--coral);color:#fff;font-weight:500;cursor:pointer;border:none;}
.cal-signout-btn{font-size:11px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;}
/* ── Upcoming banner ── */
.upcoming-banner{background:var(--mustard-bg);border:1.5px solid var(--mustard);border-radius:var(--radius-lg);padding:10px 14px;margin-bottom:1rem;cursor:pointer;}
.banner-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--mustard-text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.banner-title .exp{font-size:10px;text-transform:none;letter-spacing:0;color:var(--mustard-text);}
.banner-item{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;}
.banner-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.banner-when{font-size:11px;color:var(--muted);min-width:56px;flex-shrink:0;}
/* ── Nav tabs ── */
.nav-tabs{display:flex;gap:4px;margin-bottom:1.25rem;flex-wrap:wrap;}
.ntab{padding:5px 13px;border-radius:20px;border:1.5px solid;font-size:12px;cursor:pointer;background:transparent;font-weight:500;transition:all .15s;}
.ntab-day{border-color:var(--coral);color:var(--coral);}
.ntab-day.active,.ntab-day:hover{background:var(--coral);color:#fff;}
.ntab-month{border-color:var(--mustard);color:var(--mustard-text);}
.ntab-month.active,.ntab-month:hover{background:var(--mustard);color:#2F2F2F;}
.ntab-dinner{border-color:var(--coral);color:var(--coral);}
.ntab-dinner.active,.ntab-dinner:hover{background:var(--coral);color:#fff;}
.ntab-habits{border-color:#2F8C4E;color:#2F8C4E;}
.ntab-habits.active,.ntab-habits:hover{background:#2F8C4E;color:#fff;}
.ntab-cleaning{border-color:#0F6E56;color:#0F6E56;}
.ntab-cleaning.active,.ntab-cleaning:hover{background:#0F6E56;color:#fff;}
.ntab-todo{border-color:var(--charcoal);color:var(--charcoal);}
.ntab-todo.active,.ntab-todo:hover{background:var(--charcoal);color:#fff;}
.ntab-notes{border-color:var(--charcoal);color:var(--charcoal);}
.ntab-notes.active,.ntab-notes:hover{background:var(--charcoal);color:#fff;}
/* ── Day nav ── */
.day-nav{display:flex;gap:6px;margin-bottom:1.25rem;overflow-x:auto;padding-bottom:4px;}
.day-btn{flex-shrink:0;padding:8px 12px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:transparent;text-align:center;transition:all .15s;min-width:60px;}
.day-btn .dname{font-weight:500;display:block;font-size:11px;}
.day-btn .ddate{font-size:10px;color:var(--muted);}
.day-btn:hover{border-color:var(--coral);color:var(--coral);}
.day-btn.active{background:var(--coral);border-color:var(--coral);color:#fff;}
.day-btn.active .ddate{color:rgba(255,255,255,.75);}
/* ── Sections & cards ── */
.section{margin-bottom:1.25rem;}
.st{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;padding:2px 8px;border-radius:10px;display:inline-block;}
.st-pink{background:var(--pink-bg);color:var(--pink-text);}
.st-blue{background:var(--blue-bg);color:var(--blue-text);}
.st-orange{background:var(--orange-bg);color:var(--orange-text);}
.st-green{background:#E8F5ED;color:#1A5C33;}
.st-teal{background:#E1F5EE;color:#085041;}
.st-purple{background:var(--purple-bg);color:var(--purple-text);}
.card-block{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.card-pink{border-color:var(--pink)!important;border-width:1.5px!important;}
.card-blue{border-color:var(--blue)!important;border-width:1.5px!important;}
.card-orange{border-color:var(--orange)!important;border-width:1.5px!important;}
.card-green{border-color:var(--green)!important;border-width:1.5px!important;}
.card-teal{border-color:var(--teal)!important;border-width:1.5px!important;}
.card-purple{border-color:var(--purple)!important;border-width:1.5px!important;}
/* ── Event rows ── */
.event-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);}
.event-row:last-child{border-bottom:none;}
.event-dot{width:8px;height:8px;border-radius:50%;background:var(--charcoal);flex-shrink:0;}
.event-name{flex:1;font-size:13px;}
.event-person{font-size:10px;font-weight:500;padding:1px 6px;border-radius:8px;margin-right:4px;}
.event-time{font-size:11px;color:var(--blue);font-weight:500;}
/* ── Checkable rows ── */
.check-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);}
.check-row:last-child{border-bottom:none;}
.row-label{font-size:13px;flex:1;}
.prog-bar{height:4px;border-radius:2px;margin:6px 0 10px;}
.prog-fill{height:100%;border-radius:2px;transition:width .3s;}
.prog-label{font-size:11px;color:var(--muted);}
/* ── Dinner ── */
.dp-day{font-size:12px;font-weight:500;min-width:36px;color:var(--orange);}
.dp-day.today{background:var(--orange);color:#fff;padding:2px 6px;border-radius:6px;text-align:center;}
.dp-input{flex:1;background:transparent;border:none;font-family:'DM Sans',sans-serif;font-size:13px;color:#1a1a1a;outline:none;}
.dp-input::placeholder{color:var(--muted);opacity:.6;}
.dp-saved{font-size:10px;color:var(--green);opacity:0;transition:opacity .3s;font-weight:500;}
.dp-saved.show{opacity:1;}
.dinner-plan-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);position:relative;}
.dinner-plan-row:last-child{border-bottom:none;}
.meal-suggestions{position:absolute;top:100%;left:42px;right:30px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 10px rgba(0,0,0,.08);z-index:5;max-height:160px;overflow-y:auto;}
.meal-suggestion{padding:7px 12px;font-size:12px;cursor:pointer;}
.meal-suggestion:hover{background:var(--orange-bg);}
/* ── Add rows ── */
.add-row{display:flex;gap:8px;margin-bottom:10px;}
.add-input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.add-input:focus{border-color:var(--coral);}
.add-btn{padding:9px 16px;border-radius:var(--radius);border:none;font-size:13px;font-weight:500;cursor:pointer;color:#fff;flex-shrink:0;}
.add-btn:hover{opacity:.85;}
.del-btn{width:24px;height:24px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.del-btn:hover{background:#f0eeec;color:#c0392b;}
.row-flex{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:.5px solid var(--border);}
.row-flex:last-child{border-bottom:none;}
.focus-input{width:100%;padding:10px 14px;border:1.5px solid var(--coral);border-radius:var(--radius);background:var(--coral-bg);font-family:'DM Sans',sans-serif;font-size:13px;font-style:italic;color:var(--coral-text);outline:none;}
.focus-input::placeholder{opacity:.5;font-style:italic;}
.empty-add-msg{padding:1rem 14px;text-align:center;font-size:12px;color:var(--muted);}
.empty-msg{padding:1.5rem;text-align:center;font-size:13px;color:var(--muted);}
/* ── Month view ── */
.month-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem;}
.month-hdr h2{font-family:'Lora',serif;font-size:18px;font-weight:400;color:var(--charcoal);}
.month-nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--mustard);background:transparent;color:var(--mustard-text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.month-nav-btn:hover{background:var(--mustard-bg);}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.month-dow{font-size:10px;color:var(--muted);text-align:center;font-weight:500;padding-bottom:4px;}
.month-cell{background:var(--card);border:1px solid var(--border);border-radius:6px;min-height:80px;padding:4px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
.month-cell:hover{border-color:var(--mustard);}
.month-cell.other-month{opacity:.35;}
.month-cell.today{border-color:var(--coral);border-width:2px;}
.month-cell .mc-date{font-weight:500;color:var(--gray-text);}
.month-cell .mc-evt-list{display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.month-cell .mc-evt{font-size:9px;line-height:1.3;padding:1px 4px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.month-cell .mc-more{font-size:9px;color:var(--muted);padding:0 4px;}
.month-day-panel{margin-top:1rem;}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:.75rem;font-size:11px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:4px;}
.legend .ldot{width:8px;height:8px;border-radius:50%;}
/* ── Notes ── */
.notes-area{width:100%;min-height:160px;font-family:'DM Sans',sans-serif;font-size:13px;padding:12px 14px;border:1.5px solid var(--mustard);border-radius:var(--radius);background:var(--mustard-bg);color:#2F2F2F;resize:vertical;line-height:1.6;}
.notes-area:focus{outline:none;border-color:var(--mustard-text);}
.notes-saved{font-size:11px;color:var(--green);margin-top:6px;height:14px;font-weight:500;}
/* ── Settings / People ── */
.ntab-settings{border-color:var(--charcoal);color:var(--charcoal);}
.ntab-settings.active,.ntab-settings:hover{background:var(--charcoal);color:#fff;}
.person-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--border);}
.person-row:last-child{border-bottom:none;}
.person-color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.1);cursor:pointer;flex-shrink:0;}
.person-name-input{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.person-name-input:focus{border-color:var(--coral);}
.color-picker-input{width:36px;height:28px;border:none;border-radius:4px;cursor:pointer;padding:0;}
/* ── Event modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal-title{font-family:'Lora',serif;font-size:18px;font-weight:400;color:var(--coral);margin-bottom:1.25rem;}
.modal-field{margin-bottom:.875rem;}
.modal-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;display:block;}
.modal-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:#fff;}
.modal-input:focus{border-color:var(--coral);}
.modal-select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:#fff;cursor:pointer;}
.modal-row{display:flex;gap:10px;}
.modal-row .modal-field{flex:1;}
.modal-btns{display:flex;gap:8px;margin-top:1.25rem;}
.modal-save{flex:1;padding:10px;border-radius:var(--radius);border:none;background:var(--coral);color:#fff;font-size:14px;font-weight:500;cursor:pointer;}
.modal-save:hover{opacity:.9;}
.modal-cancel{padding:10px 16px;border-radius:var(--radius);border:1.5px solid var(--border);background:transparent;font-size:14px;cursor:pointer;color:var(--muted);}
.app-event-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid currentColor;}
/* ── Sync indicator ── */
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;}
.sync-dot.syncing{background:var(--yellow);animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-screen" style="display:none">
  <!-- StickyPaper Logo -->
  <div style="margin-bottom:1.5rem">
    <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="56" fill="#FFFDF8" stroke="#F4B400" stroke-width="4"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="#F4B400" stroke-width="1.5"/>
      <text x="60" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#2F2F2F">Sticky</text>
      <text x="60" y="76" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#2F2F2F">Paper</text>
      <path d="M22 90 Q60 104 98 90" fill="none" stroke="#F4B400" stroke-width="1.5"/>
      <text x="60" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#2F2F2F" letter-spacing="1.5">WHERE ORGANISATION STICKS.</text>
    </svg>
  </div>
  <div style="background:#fff;border-radius:16px;padding:2rem 2rem 1.5rem;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:340px;width:100%">
  <h1 style="font-size:24px;margin-bottom:.25rem">Weekly Planner</h1>
  <p style="font-size:11px;color:var(--mustard-text);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem">by StickyPaper</p>
  <p style="font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.6">Your personal family planner. Sign in with Google to get started — your data syncs across all your devices.</p>
  <button class="google-btn" id="google-signin-btn" style="width:100%;justify-content:center">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Sign in with Google
  </button>
  <p class="auth-loading" id="auth-loading" style="display:none;margin-top:1rem">Loading…</p>
  </div>
</div>

<!-- MAIN APP -->
<div class="app" id="main-app" style="display:none">
  <div class="top-header">
    <div>
      <h1>StickyPaper Weekly Planner</h1>
      <div style="font-size:10px;color:var(--mustard-text);letter-spacing:.06em;text-transform:uppercase;font-weight:500">Where organisation sticks.</div>
    </div>
    <div class="header-right">
      <span class="week-range" id="week-range"></span>
      <span id="sync-status" style="font-size:11px;color:var(--muted)"></span>
      <img class="user-avatar" id="user-avatar" src="" alt="" style="display:none">
      <button class="signout-btn" id="signout-btn">Sign out</button>
    </div>
  </div>

  <div class="cal-bar" id="cal-bar">
    <span class="cal-status" id="cal-status">Connecting to Google Calendar…</span>
    <button class="cal-signin-btn" id="cal-signin-btn" style="display:none">Connect Calendar</button>
    <button class="cal-signout-btn" id="cal-signout-btn" style="display:none">Disconnect</button>
  </div>

  <div class="upcoming-banner" id="upcoming-banner" onclick="setView('month')">
    <div class="banner-title"><span>Coming up in the next 7 days</span><span class="exp">View full month →</span></div>
    <div id="banner-items"></div>
  </div>

  <div class="nav-tabs" id="nav-tabs"></div>

  <div id="view-day"><div class="day-nav" id="day-nav"></div><div id="day-content"></div></div>
  <div id="view-month"    style="display:none"></div>
  <div id="view-dinner"   style="display:none"></div>
  <div id="view-habits"   style="display:none"></div>
  <div id="view-cleaning" style="display:none"></div>
  <div id="view-todo"     style="display:none"></div>
  <div id="view-notes"    style="display:none"></div>
  <div id="view-settings" style="display:none"></div>
</div>

<!-- Add Event Modal -->
<div id="event-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title">Add Event</div>
    <div class="modal-field">
      <label class="modal-label">Event title *</label>
      <input class="modal-input" id="ev-title" type="text" placeholder="e.g. Hockey practice">
    </div>
    <div class="modal-row">
      <div class="modal-field">

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dkey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
function startOfWeek(d){const x=new Date(d);x.setHours(0,0,0,0);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return x;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

let activeDay=0, currentView='day';
let weekCursor=startOfWeek(new Date());
let monthCursor=new Date();
let selectedMonthDate=null;

// ════════════════════════════════════════

// ════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════
onAuthStateChanged(auth, user=>{

document.getElementById('google-signin-btn').addEventListener('click', async ()=>{

  try{
    const result = await signInWithPopup(auth, provider);

    const cred = GoogleAuthProvider.credentialFromResult(result);

document.getElementById('signout-btn').addEventListener('click', async ()=>{

// ════════════════════════════════════════
//  GOOGLE CALENDAR (uses token from sign-in)
// ════════════════════════════════════════
let tokenClient=null;

function initTokenClient(){
  if(typeof google==='undefined'||!google.accounts){
    return;
  }
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_OAUTH_CLIENT_ID,
    scope:'https://www.googleapis.com/auth/calendar.readonly',
    callback:(resp)=>{
      if(resp.error){
        refreshCalendarUI(false);
        return;
      }
      calToken=resp.access_token;
      if(currentUser)localStorage.setItem('cal_token_'+currentUser.uid, calToken);
      fetchCalendarEvents();
    }
  });
}

function tryAutoCalendar(user){
  // Wait for GIS to load then init token client
  const tryInit=()=>{
    if(typeof google!=='undefined'&&google.accounts){
      initTokenClient();
      const stored=localStorage.getItem('cal_token_'+user.uid);
      if(stored){
        calToken=stored;
        fetchCalendarEvents();
      } else {
        calToken=null;
        refreshCalendarUI(false);
      }
    } else {
      setTimeout(tryInit, 300);
    }
  };
  tryInit();
}

function refreshCalendarUI(loaded){
  const statusEl=document.getElementById('cal-status');
  const signinBtn=document.getElementById('cal-signin-btn');
  const signoutBtn=document.getElementById('cal-signout-btn');
  if(calToken && loaded){
    statusEl.textContent='✓ Google Calendar connected — '+calEvents.length+' events loaded';
    signinBtn.style.display='none';
    signoutBtn.style.display='inline';
  }else if(calToken && !loaded){
    statusEl.textContent='Loading calendar…';
    signinBtn.style.display='none';
    signoutBtn.style.display='inline';
  }else{
    statusEl.textContent='Connect your Google Calendar to see events';
    signinBtn.style.display='inline';
    signoutBtn.style.display='none';
  }
}

document.getElementById('cal-signin-btn').addEventListener('click', ()=>{
  if(tokenClient){
    tokenClient.requestAccessToken({prompt:''});
  } else {
    document.getElementById('cal-status').textContent='Calendar not ready — please refresh the page.';
  }
});

document.getElementById('cal-signout-btn').addEventListener('click', ()=>{
  calToken=null;calEvents=[];
  if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
  refreshCalendarUI(false);renderBanner();renderDayContent();
  if(currentView==='month')renderMonth();
});

async function fetchCalendarEvents(){
  if(!calToken)return;
  document.getElementById('cal-status').textContent='Loading calendar…';
  try{
    const timeMin=new Date();timeMin.setMonth(timeMin.getMonth()-1);
    const timeMax=new Date();timeMax.setMonth(timeMax.getMonth()+6);
    const params=new URLSearchParams({
      timeMin:timeMin.toISOString(),
      timeMax:timeMax.toISOString(),
      singleEvents:'true',
      orderBy:'startTime',
      maxResults:'2500'
    });
    const res=await fetch(
      'https://www.googleapis.com/calendar/v3/calendars/primary/events?'+params,
      {headers:{Authorization:'Bearer '+calToken}}
    );
    if(res.status===401){
      calToken=null;if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
      refreshCalendarUI(false);
      renderBanner();
      return;
    }
    if(!res.ok){
      calToken=null;if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
      refreshCalendarUI(false);
      renderBanner();
      return;
    }
    const data=await res.json();
    calEvents=(data.items||[]).map(ev=>{
      const allDay=!!(ev.start&&ev.start.date);
      const start=allDay?new Date(ev.start.date+'T00:00:00'):new Date(ev.start.dateTime);
      const end=allDay?new Date(ev.end.date+'T00:00:00'):new Date(ev.end.dateTime);
      const {person,name}=parsePersonTag(ev.summary||'(untitled)');
      return{start,end,allDay,person,name};
    });
    refreshCalendarUI(true);
    renderBanner();
    renderDayContent();
    if(currentView==='month'){renderMonth();}
  }catch(err){
    calToken=null;if(currentUser)localStorage.removeItem('cal_token_'+currentUser.uid);
    refreshCalendarUI(false);
    renderBanner();
  }
}

function parsePersonTag(title){
  const m=(title||'').match(/^\s*\[([^\]]+)\]\s*(.*)$/);
  if(m)return{person:m[1].trim(),name:m[2].trim()||m[1].trim()};
  return{person:null,name:title||''};
}
function personStyle(person){
  if(!person)return PERSON_COLORS['_default'];
  // Check user's own saved people first
  if(DATA.userPeople&&DATA.userPeople.length){
    const lower=person.toLowerCase();
    const found=DATA.userPeople.find(p=>p.name.toLowerCase()===lower);
    if(found){
      const bg=found.color+'22';
      return{dot:found.color,bg:bg,text:found.color};
    }
  }
  // Fall back to built-in colours
  if(PERSON_COLORS[person])return PERSON_COLORS[person];
  const lower=person.toLowerCase();
  for(const key of Object.keys(PERSON_COLORS)){
    if(key!=='_default'&&key.toLowerCase()===lower)return PERSON_COLORS[key];
  }
  return PERSON_COLORS['_default'];
}
function eventsOnDate(dateObj){
  const y=dateObj.getFullYear(),m=dateObj.getMonth(),da=dateObj.getDate();
  const d=new Date(y,m,da);
  // Google Calendar events
  const gcal=calEvents.filter(ev=>{
    const s=new Date(ev.start.getFullYear(),ev.start.getMonth(),ev.start.getDate());
    const eEnd=new Date(ev.end.getFullYear(),ev.end.getMonth(),ev.end.getDate());
    if(ev.allDay)return d>=s&&d<eEnd;
    return d.getTime()===s.getTime();
  });
  // App events
  const dk=dkey(dateObj);
  const appEvs=(DATA.appEvents||[]).filter(e=>e.date===dk).map(e=>({
    start:e.allDay?new Date(dk+'T00:00:00'):new Date(dk+'T'+(e.time||'00:00')+':00'),
    end:new Date(dk+'T23:59:00'),
    allDay:!!e.allDay,
    person:e.person||null,
    name:e.title,
    isAppEvent:true,
    id:e.id
  }));
  return [...gcal,...appEvs].sort((a,b)=>{
    if(a.allDay&&!b.allDay)return -1;
    if(!a.allDay&&b.allDay)return 1;
    return a.start-b.start;
  });
}
function fmtTime(d,allDay){
  if(allDay)return'All day';
  return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}

// ════════════════════════════════════════
//  APP INIT
// ════════════════════════════════════════
function init(){
  weekCursor=startOfWeek(new Date());
  activeDay=(new Date().getDay()+6)%7;
  updateWeekRange();
  renderNavTabs();
  renderDayNav();renderDayContent();setView('day');
  refreshCalendarUI(false);
}

function renderNavTabs(){
  const ts=DATA.tabSettings||{};
  const CONFIGURABLE=['dinner','habits','cleaning','todo','notes'];
  const COLOR_MAP={dinner:'coral',habits:'green',cleaning:'teal',todo:'charcoal',notes:'charcoal'};
  let h=`<button class="ntab ntab-day${currentView==='day'?' active':''}" onclick="setView('day')">Day</button>`;
  h+=`<button class="ntab ntab-month${currentView==='month'?' active':''}" onclick="setView('month')">Month</button>`;
  CONFIGURABLE.forEach(key=>{
    const cfg=ts[key]||{visible:true,label:key.charAt(0).toUpperCase()+key.slice(1)};
    if(!cfg.visible)return;
    const col=COLOR_MAP[key]||'charcoal';
    const active=currentView===key?' active':'';
    h+=`<button class="ntab ntab-${key}${active}" onclick="setView('${key}')">${esc(cfg.label)}</button>`;
  });
  h+=`<button class="ntab ntab-settings${currentView==='settings'?' active':''}" onclick="setView('settings')">⚙</button>`;
  document.getElementById('nav-tabs').innerHTML=h;
}
function updateWeekRange(){
  const end=new Date(weekCursor);end.setDate(end.getDate()+6);
  const fmt=d=>d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('week-range').textContent=fmt(weekCursor)+' – '+fmt(end);
}
function renderAll(){
  renderNavTabs();
  renderDayContent();renderBanner();
  if(currentView==='month')renderMonth();
  else if(currentView==='dinner')renderDinner();
  else if(currentView==='habits')renderHabits();
  else if(currentView==='cleaning')renderCleaning();
  else if(currentView==='todo')renderTodo();
  else if(currentView==='notes')renderNotes();
  else if(currentView==='settings')renderSettings();
}

// ════════════════════════════════════════
//  BANNER
// ════════════════════════════════════════
function renderBanner(){
  const el=document.getElementById('banner-items');
  if(!calToken){
    el.innerHTML='<span style="font-size:12px;color:var(--mustard-text)">Click <b>Connect Calendar</b> above to see what's coming up 📅</span>';
    return;
  }
  if(calEvents.length===0){
    el.innerHTML='<span style="font-size:12px;color:var(--mustard-text);">Loading calendar events…</span>';
    return;
  }
  const today=new Date();today.setHours(0,0,0,0);
  const items=[];
  for(let i=0;i<=7;i++){
    const d=new Date(today);d.setDate(d.getDate()+i);
    eventsOnDate(d).forEach(ev=>{
      const dayLabel=(()=>{
        if(i===0)return'Today';
        if(i===1)return'Tomorrow';
        const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return dn[d.getDay()]+' '+d.getDate();
      })();
      items.push({diff:i,day:dayLabel,ev});
    });
  }
  el.innerHTML=items.length
    ?items.map(it=>{
        const ps=personStyle(it.ev.person);
        const tag=it.ev.person?`<span class="event-person" style="background:${ps.bg};color:${ps.text}">${esc(it.ev.person)}</span>`:'';
        return`<div class="banner-item"><div class="banner-dot" style="background:${ps.dot}"></div><span class="banner-when">${it.day}</span>${tag}<span>${esc(it.ev.name)}</span></div>`;
      }).join('')
    :'<span style="font-size:12px;color:var(--mustard-text);">Nothing scheduled in the next 7 days — enjoy the calm! ✨</span>';
}

// ════════════════════════════════════════
//  VIEWS
// ════════════════════════════════════════
const VIEWS=['day','month','dinner','habits','cleaning','todo','notes','settings'];
function setView(v){
  currentView=v;
  VIEWS.forEach(x=>document.getElementById('view-'+x).style.display=x===v?'block':'none');
  renderNavTabs();
  if(v==='month')renderMonth();
  if(v==='dinner')renderDinner();

  if(v==='cleaning')renderCleaning();
  if(v==='todo')renderTodo();
  if(v==='notes')renderNotes();
  if(v==='settings')renderSettings();
}

// ── DAY VIEW ──
function dayDate(i){const d=new Date(weekCursor);d.setDate(d.getDate()+i);return d;}
function renderDayNav(){

    `<button class="month-nav-btn" id="week-prev" style="margin-right:4px">‹</button>`+

}

window.setView=setView;

  h+=`<div class="section"><div class="st st-orange">Dinner</div><div class="card-block card-orange" style="position:relative">
    <div class="dinner-plan-row">
      <span style="font-size:14px">🍽</span>

  });

function showMealSuggestions(query,box,inputEl,k){
  const q=(query||'').trim().toLowerCase();
  let matches=DATA.mealHistory.filter(m=>m.toLowerCase()!==q);
  if(q)matches=matches.filter(m=>m.toLowerCase().includes(q));
  matches=matches.slice(0,6);
  if(!matches.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="meal-suggestions">${matches.map(m=>`<div class="meal-suggestion" data-val="${esc(m)}">${esc(m)}</div>`).join('')}</div>`;
  box.querySelectorAll('.meal-suggestion').forEach(el=>{el.addEventListener('mousedown',function(ev){ev.preventDefault();const v=this.dataset.val;inputEl.value=v;DATA.dinnerByDate[k]=v;save();box.innerHTML='';});});
}
function rememberMeal(val){
  const v=(val||'').trim();if(!v)return;
  DATA.mealHistory=DATA.mealHistory.filter(m=>m.toLowerCase()!==v.toLowerCase());
  DATA.mealHistory.unshift(v);
  if(DATA.mealHistory.length>40)DATA.mealHistory=DATA.mealHistory.slice(0,40);
  save();
}
function toggleHabitForDate(habitId,k){
  if(!DATA.habitDone[k])DATA.habitDone[k]={};
  DATA.habitDone[k][habitId]=!DATA.habitDone[k][habitId];
  save();renderDayContent();
  if(currentView==='habits')renderHabits();
}
function toggleCleaningForDate(cleanId,k){
  if(!DATA.cleaningDone[k])DATA.cleaningDone[k]={};
  DATA.cleaningDone[k][cleanId]=!DATA.cleaningDone[k][cleanId];
  save();renderCleaning();
}
function toggleTodo(id){const t=DATA.todos.find(t=>t.id===id);if(t){t.done=!t.done;save();renderTodo();}}

// ── MONTH VIEW ──
function renderMonth(){
  const el=document.getElementById('view-month');
  const year=monthCursor.getFullYear(),month=monthCursor.getMonth();
  const monthName=monthCursor.toLocaleDateString([],{month:'long',year:'numeric'});
  const firstOfMonth=new Date(year,month,1);
  const startOffset=(firstOfMonth.getDay()+6)%7;
  const gridStart=new Date(year,month,1-startOffset);
  let h=`<div class="month-hdr"><button class="month-nav-btn" id="month-prev">‹</button><h2>${monthName}</h2><button class="month-nav-btn" id="month-next">›</button></div>`;
  if(!calToken){
    h+=`<div class="empty-msg">Connect Google Calendar above to see your full month.</div>`;
    el.innerHTML=h;
    document.getElementById('month-prev').addEventListener('click',()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderMonth();});
    document.getElementById('month-next').addEventListener('click',()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderMonth();});
    return;
  }
  h+='<div class="month-grid">';
  SHORT.forEach(s=>h+=`<div class="month-dow">${s}</div>`);
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<42;i++){
    const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);
    const inMonth=d.getMonth()===month;
    const isToday=d.getTime()===today.getTime();
    const evts=eventsOnDate(d);
    const labels=evts.slice(0,3).map(ev=>{const ps=personStyle(ev.person);const shortName=ev.name.length>16?ev.name.slice(0,15)+'…':ev.name;return`<span class="mc-evt" style="background:${ps.bg};color:${ps.text}" title="${esc(ev.name)}">${esc(shortName)}</span>`;}).join('');
    const more=evts.length>3?`<span class="mc-more">+${evts.length-3} more</span>`:'';
    const dStr=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    h+=`<div class="month-cell${inMonth?'':' other-month'}${isToday?' today':''}" data-datestr="${dStr}"><span class="mc-date">${d.getDate()}</span><div class="mc-evt-list">${labels}${more}</div></div>`;
  }
  h+='</div>';
  const peopleInUse=[...new Set(calEvents.map(e=>e.person).filter(Boolean))];
  if(peopleInUse.length){h+='<div class="legend">'+peopleInUse.map(p=>{const ps=personStyle(p);return`<span><span class="ldot" style="background:${ps.dot}"></span>${esc(p)}</span>`;}).join('')+'</div>';}
  h+=`<div class="month-day-panel" id="month-day-panel"></div>`;
  el.innerHTML=h;
  document.getElementById('month-prev').addEventListener('click',()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderMonth();});
  document.getElementById('month-next').addEventListener('click',()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderMonth();});
  el.querySelectorAll('.month-cell').forEach(cell=>{cell.addEventListener('click',()=>{const parts=cell.dataset.datestr.split('-');selectedMonthDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));renderMonthDayPanel();});});
  if(!selectedMonthDate){selectedMonthDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());}
  renderMonthDayPanel();
}
function renderMonthDayPanel(){
  const panel=document.getElementById('month-day-panel');
  if(!panel||!selectedMonthDate)return;
  const evts=eventsOnDate(selectedMonthDate);
  const label=selectedMonthDate.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
  let h=`<div class="st st-purple">${esc(label)}</div><div class="card-block card-purple">`;
  if(!evts.length){h+='<div class="empty-msg">No events this day.</div>';}
  else{evts.forEach(ev=>{const ps=personStyle(ev.person);const tag=ev.person?`<span class="event-person" style="background:${ps.bg};color:${ps.text}">${esc(ev.person)}</span>`:'';const dotStyle=ev.isAppEvent?`border:2px solid ${ps.dot};background:transparent`:`background:${ps.dot}`;
      const delBtn=ev.isAppEvent?`<button class="del-btn" onclick="deleteAppEvent('${ev.id}')">✕</button>`:'';
      h+=`<div class="event-row"><div class="event-dot" style="${dotStyle}"></div>${tag}<span class="event-name">${esc(ev.name)}${ev.allDay?'':' <span style="font-size:10px;color:var(--muted)">'+fmtTime(ev.start,false)+'</span>'}</span>${delBtn}</div>`;});}
  h+='</div>';
  panel.innerHTML=h;
}

};

document.getElementById('ev-cancel').addEventListener('click',()=>{
  document.getElementById('event-modal').style.display='none';
});
document.getElementById('event-modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('event-modal'))
    document.getElementById('event-modal').style.display='none';
});
document.getElementById('ev-save').addEventListener('click',()=>{
  const title=document.getElementById('ev-title').value.trim();
  const date=document.getElementById('ev-date').value;
  if(!title||!date){
    document.getElementById('ev-title').focus();return;
  }
  const ev={
    id:uid(),
    title,
    date,
    time:document.getElementById('ev-time').value||'',
    person:document.getElementById('ev-person').value||null,
    allDay:document.getElementById('ev-allday').checked
  };
  if(!DATA.appEvents)DATA.appEvents=[];
  DATA.appEvents.push(ev);
  save();
  document.getElementById('event-modal').style.display='none';
  // Re-render if the event is on the current day
  if(date===dkey(dayDate(activeDay)))renderDayContent();
  if(currentView==='month')renderMonth();
  renderBanner();
});
document.getElementById('ev-title').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('ev-save').click();
});

// ── SETTINGS / PEOPLE ──
function renderSettings(){
  const el=document.getElementById('view-settings');
  if(!DATA.userPeople)DATA.userPeople=[];
  if(!DATA.tabSettings)DATA.tabSettings={
    dinner:{visible:true,label:'Dinner'},
    habits:{visible:true,label:'Habits'},
    cleaning:{visible:true,label:'Cleaning'},
    todo:{visible:true,label:'To-do'},
    notes:{visible:true,label:'Notes'}
  };

  const TAB_LABELS={dinner:'Dinner',habits:'Habits',cleaning:'Cleaning',todo:'To-do',notes:'Notes'};

  let h=`
  <!-- PEOPLE SECTION -->
  <div class="section">
    <div class="st st-pink" style="margin-bottom:12px">👥 People & Colours</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5">
      Add names that match your Google Calendar or app event tags like <b>[Luke] Hockey</b>. 
      Each person gets their own colour in all calendar views.
    </p>
    <div class="add-row">
      <input class="add-input" id="people-name-input" type="text" placeholder="Person name (e.g. Luke)">
      <input type="color" id="people-color-input" value="#FF5A5F" style="width:44px;height:38px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;padding:2px;">
      <button class="add-btn" id="people-add-btn" style="background:var(--coral)">Add</button>
    </div>
    <div class="card-block card-pink" id="people-list">`;

  if(!DATA.userPeople.length){
    h+=`<div class="empty-add-msg">No people added yet.</div>`;
  } else {
    DATA.userPeople.forEach((p,i)=>{
      h+=`<div class="person-row">
        <div class="person-color-swatch" style="background:${p.color}"></div>
        <input class="person-name-input" data-idx="${i}" value="${esc(p.name)}" placeholder="Name">
        <input type="color" class="person-color-picker" data-idx="${i}" value="${p.color}" style="width:36px;height:28px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;padding:1px;">
        <button class="del-btn people-del" data-idx="${i}">✕</button>
      </div>`;
    });
  }
  h+=`</div>
    <p style="font-size:11px;color:var(--muted);margin-top:8px">Changes save automatically.</p>
  </div>

  <!-- TABS SECTION -->
  <div class="section" style="margin-top:1.5rem">
    <div class="st st-pink" style="margin-bottom:12px">🗂 My Tabs</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5">
      Show or hide tabs, and rename them to suit your family. 
      Day view, Month view and Settings are always visible.
    </p>
    <div class="card-block card-pink">`;

  Object.keys(TAB_LABELS).forEach(key=>{
    const cfg=DATA.tabSettings[key]||{visible:true,label:TAB_LABELS[key]};
    h+=`<div class="person-row" style="gap:12px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0">
        <input type="checkbox" class="tab-toggle" data-key="${key}" ${cfg.visible?'checked':''} style="width:16px;height:16px;accent-color:var(--coral);cursor:pointer">
        <span style="font-size:12px;color:var(--muted);width:56px">${cfg.visible?'Visible':'Hidden'}</span>
      </label>
      <input class="person-name-input tab-label-input" data-key="${key}" value="${esc(cfg.label)}" placeholder="${TAB_LABELS[key]}" style="flex:1">
      <span style="font-size:11px;color:var(--muted)">(default: ${TAB_LABELS[key]})</span>
    </div>`;
  });

  h+=`</div>
    <p style="font-size:11px;color:var(--muted);margin-top:8px">Tap the label to rename any tab.</p>
  </div>`;

  el.innerHTML=h;

  // ── People handlers ──
  const nameIn=document.getElementById('people-name-input');
  const colorIn=document.getElementById('people-color-input');
  document.getElementById('people-add-btn').addEventListener('click',()=>{
    const n=nameIn.value.trim();if(!n)return;
    DATA.userPeople.push({name:n,color:colorIn.value});
    nameIn.value='';save();renderSettings();renderNavTabs();
  });
  nameIn.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('people-add-btn').click();});
  el.querySelectorAll('.person-name-input:not(.tab-label-input)').forEach(inp=>{
    inp.addEventListener('change',function(){DATA.userPeople[this.dataset.idx].name=this.value.trim();save();renderNavTabs();});
  });
  el.querySelectorAll('.person-color-picker').forEach(inp=>{
    inp.addEventListener('input',function(){
      DATA.userPeople[this.dataset.idx].color=this.value;
      this.closest('.person-row').querySelector('.person-color-swatch').style.background=this.value;
      save();
    });
  });
  el.querySelectorAll('.people-del').forEach(btn=>{
    btn.addEventListener('click',function(){
      DATA.userPeople.splice(parseInt(this.dataset.idx),1);
      save();renderSettings();
    });
  });

  // ── Tab toggle handlers ──
  el.querySelectorAll('.tab-toggle').forEach(cb=>{
    cb.addEventListener('change',function(){
      if(!DATA.tabSettings[this.dataset.key])DATA.tabSettings[this.dataset.key]={visible:true,label:TAB_LABELS[this.dataset.key]};
      DATA.tabSettings[this.dataset.key].visible=this.checked;
      // Update the visible/hidden label
      this.nextElementSibling.textContent=this.checked?'Visible':'Hidden';
      save();renderNavTabs();
    });
  });
  el.querySelectorAll('.tab-label-input').forEach(inp=>{
    inp.addEventListener('change',function(){
      if(!DATA.tabSettings[this.dataset.key])DATA.tabSettings[this.dataset.key]={visible:true,label:TAB_LABELS[this.dataset.key]};
      DATA.tabSettings[this.dataset.key].label=this.value.trim()||TAB_LABELS[this.dataset.key];
      save();renderNavTabs();
    });
  });
}

// Show auth screen initially while Firebase loads
document.getElementById('auth-screen').style.display='flex';
document.getElementById('auth-loading').style.display='block';
document.getElementById('auth-loading').textContent='Loading…';

</script>
</body>
</html>
